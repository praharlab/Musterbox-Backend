<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal Review Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }

      th {
        border: 1px solid #000;
        padding: 5px;
        text-align: left;
        font-size: 12px;
      }

      td {
        border: 1px solid #000;
        padding: 5px;
        text-align: left;
        font-size: 12px;
      }

      th {
        background-color: #f2f2f2;
      }

      h2,
      h3 {
        text-align: center;
      }

      .pageBreak {
        page-break-before: always !important;
        page-break-inside: avoid !important;
      }
    </style>
  </head>

  <body>
    <h2>Goal Review Report</h2>
    {{pdfGenerationObject}}
  </body>
</html>
