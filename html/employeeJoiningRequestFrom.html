<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Joining Request</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }

      th,
      td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #f2f2f2;
      }

      h1,
      h2 {
        text-align: center;
      }

      
      .pageBreak {
        page-break-before: always !important;
        page-break-inside: avoid !important;
      }
    </style>
  </head>

  <body>
    <div
      style="display: flex; flex-direction: row; justify-content: space-between"
    >
      <span>
        <h3 style="margin-bottom: 0px !important">Joining Request Form</h3>
      </span>
      <span>
        <h5 style="margin-bottom: 0px !important">{{companyName}}</h5>
      </span>
    </div>

    <div style="text-align: right">
      <span style="font-size: 11px; margin-left: 40%">{{companyAddress}}</span>
    </div>
    <br />
    <table>
      {{personalInformation}}
    </table>
    <br />
    <table>
      {{addressinformation}}
    </table>
    <br />
    <table>
      {{uniformDetail}}
    </table>
    <br />
    <table>
      {{ImporttantInformation}}
    </table>
    <br />
    <table>
      {{bankDetails}}
    </table>
    <br />
    <table>
      {{singatureDetails}}
    </table>
  </body>
</html>
